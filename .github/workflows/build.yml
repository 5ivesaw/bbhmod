name: Build BBH Minecraft Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod
        working-directory: mod
        run: bash ./gradlew parityTest build -x test --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: bbh-mod
          path: mod/build/libs/*.jar
          if-no-files-found: error
